name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_SECRET: ci-placeholder-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run format:check

      - run: npm run test

      - run: npm run build

  integration-and-e2e:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_SECRET: ci-placeholder-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Starts the same local Postgres/Auth/Storage/Data-API stack
      # `supabase start` gives every contributor locally, applying all
      # of supabase/migrations along the way — integration tests and
      # E2E both run against this, never a mocked or hand-rolled DB.
      - run: supabase start

      # `supabase status -o env`'s own variable names (API_URL,
      # ANON_KEY, SERVICE_ROLE_KEY, ...) don't match this app's env var
      # names — --override-name renames the ones the app actually
      # reads (see .env.example); stdout also has a stray
      # "Stopped services: [...]" notice line ahead of the real KEY="..."
      # lines, filtered out here since GITHUB_ENV only tolerates
      # KEY=value lines.
      - name: Export local Supabase connection details
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^[A-Z_]+=' | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      - run: npm run test:integration

      - run: npx playwright install --with-deps chromium

      # webServer in playwright.config.ts runs `npm run build && npm
      # run start` itself against the now-exported Supabase env vars.
      - run: npx playwright test --project=chromium

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
