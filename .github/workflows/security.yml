name: Security

# Hardening (2026-11-03): supply chain and code scanning alongside CI.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, for newly published advisories

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # What ships to users: fail on high or critical advisories.
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The whole history, so a secret committed and later removed is
      # still caught (it must be rotated, not just deleted).
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2
          detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
